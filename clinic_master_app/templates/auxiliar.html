{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clinic Master{% endblock %}</title>

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/sidebar.js' %}"></script>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <button class="btn menu-btn" type="button" id="toggleSidebar">
            ☰ Menú
        </button>
        <a href="{% url 'home' %}">Clinic Master</a>
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Cerrar sesión</button>
        </form>
    </div>

    <!-- Menú lateral
    <div class="sidebar" id="sidebarMenu">
        <h5>Menú</h5>
        <a href="{% url 'crear_cita' %}">Crear</a>
        <a href="{% url 'listar_citas' %}">Listar</a>
    </div> -->

    <!-- Menú lateral -->
    <div class="offcanvas offcanvas-start" id="sidebarMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menú</h5>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="{% url 'crear_cita' %}">Crear</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'listar_citas' %}">Listar</a></li>
            </ul>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2024 Clinic Master - Todos los derechos reservados.</p>
    </footer>
</body>
</html>
