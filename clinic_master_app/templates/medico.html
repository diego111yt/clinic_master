{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clinic Master{% endblock %}</title>
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{% static 'css/medico.css' %}">
    <script src="{% static 'js/sidebar.js' %}"></script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <button class="btn menu-btn" type="button" id="toggleSidebar">
                ☰ Menú
            </button>
            <a class="navbar-brand" href="{% url 'home' %}">Clinic Master</a>
            <div class="navbar-right">
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn logout-btn">
                        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Menú lateral -->
    <div class="offcanvas offcanvas-start" id="sidebarMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menú</h5>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="{% url 'listar_citas_activas' %}">Consultas</a></li>
            </ul>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2024 Clinic Master - Todos los derechos reservados.</p>
    </footer> 
</body>
</html>
