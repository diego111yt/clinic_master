{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clinic Master{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/sidebar.js' %}"></script>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <button class="btn menu-btn" type="button" id="toggleSidebar">
            ☰ Menú
        </button>
        <a href="{% url 'home' %}">Clinic Master</a>
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Cerrar sesión</button>
        </form>
    </div>

    <!-- Sidebar -->
    <div class="offcanvas" id="sidebarMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menú</h5>
        </div>
        <div class="offcanvas-body">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="{% url 'listar_personas' %}">Personas</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'listar_empleados' %}">Empleados</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'listar_usuarios' %}">Usuarios</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'listar_eps' %}">EPS</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'listar_personas_inactivas' %}">Usuarios Inactivos</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'listar_contratos' %}">Contratos</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'crear_usuario' %}">Crear usuarios</a></li>
            </ul>
        </div>
    </div>

    <!-- Carrusel (estático simple) -->
    <div class="carousel-container">
        <div class="carousel-slide" id="carousel-slide">
            <img src="{% static 'images/pag_web2.jpg' %}" alt="Imagen 1">
        </div>  
    </div>

    <!-- Contenido principal -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2024 Clinic Master - Todos los derechos reservados.</p>
    </footer>
</body>
</html>
